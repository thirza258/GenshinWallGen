<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151D4D" />
      <stop offset="60%" stop-color="#0E1333" />
      <stop offset="100%" stop-color="#070A1A" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D4A054" />
      <stop offset="100%" stop-color="#A67026" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF3" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDE7CE" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="1240" height="670" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative Stars & Constellations -->
  <circle cx="150" cy="120" r="2" fill="#FFE8A3" opacity="0.6"/>
  <circle cx="320" cy="80" r="3" fill="#FFE8A3" opacity="0.8"/>
  <circle cx="580" cy="140" r="1.5" fill="#FFE8A3" opacity="0.4"/>
  <circle cx="950" cy="90" r="2.5" fill="#FFE8A3" opacity="0.7"/>
  <circle cx="1080" cy="160" r="2" fill="#FFE8A3" opacity="0.5"/>
  <circle cx="110" cy="480" r="2" fill="#FFE8A3" opacity="0.5"/>

  <!-- Star Crosses -->
  <path d="M1020 220 L1020 240 M1010 230 L1030 230" stroke="#FFE8A3" stroke-width="2" opacity="0.6"/>
  <path d="M200 240 L200 256 M192 248 L208 248" stroke="#FFE8A3" stroke-width="1.5" opacity="0.5"/>

  <!-- Left Header & Badge -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#D4A054" fill-opacity="0.15" stroke="#D4A054" stroke-opacity="0.4"/>
    <text x="20" y="24" fill="#FFE8A3" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="1">✦ GENSHIN TASK WALLPAPER</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      GenshinWallCraft
    </text>
    <text x="0" y="150" fill="url(#gold-grad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">
      4K Daily Task & Boss Organizer
    </text>

    <!-- Description -->
    <text x="0" y="200" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Turn daily commissions, weekly bosses & resin targets
    </text>
    <text x="0" y="228" fill="#CBD5E1" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      into aesthetic Genshin Impact desktop wallpapers.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="18" y="22" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">✓ 50+ 4K Art</text>

      <rect x="145" y="0" width="130" height="34" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="160" y="22" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">✓ Free & Instant</text>

      <rect x="290" y="0" width="145" height="34" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="306" y="22" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">✓ Anonymous/Sync</text>
    </g>
  </g>

  <!-- Right Side Mockup Card -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="460" height="390" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Screen Area -->
    <rect x="12" y="12" width="436" height="366" rx="10" fill="#0F172A"/>

    <!-- Task Window Component Inside Mockup -->
    <g transform="translate(30, 30)">
      <!-- Daily Tasks Section -->
      <rect x="0" y="0" width="396" height="150" rx="10" fill="url(#card-bg)" stroke="#151D4D" stroke-opacity="0.2"/>
      <text x="16" y="26" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">DAILY COMMISSIONS (4/4)</text>

      <!-- Task Item 1 -->
      <rect x="14" y="38" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.08"/>
      <rect x="22" y="44" width="12" height="12" rx="3" fill="#151D4D"/>
      <path d="M25 50 L27 52 L31 47" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="54" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-decoration="line-through" opacity="0.6">Claim Katheryne 4 Commissions Reward</text>

      <!-- Task Item 2 -->
      <rect x="14" y="66" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.08"/>
      <rect x="22" y="72" width="12" height="12" rx="3" fill="#151D4D"/>
      <path d="M25 78 L27 80 L31 75" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="82" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-decoration="line-through" opacity="0.6">Spend 160 Condensed Resin (Artifacts)</text>

      <!-- Task Item 3 -->
      <rect x="14" y="94" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.08"/>
      <rect x="22" y="100" width="12" height="12" rx="3" fill="#151D4D"/>
      <path d="M25 106 L27 108 L31 103" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="110" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-decoration="line-through" opacity="0.6">Expedition Collect & Realm Currency</text>

      <!-- Task Item 4 -->
      <rect x="14" y="122" width="368" height="22" rx="6" fill="#151D4D" fill-opacity="0.04"/>
      <rect x="22" y="127" width="12" height="12" rx="3" fill="none" stroke="#151D4D" stroke-width="1.5"/>
      <text x="42" y="136" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Forging Mystic Ore & Battle Pass Exp</text>
    </g>

    <!-- Weekly Bosses Section Inside Mockup -->
    <g transform="translate(30, 195)">
      <rect x="0" y="0" width="396" height="135" rx="10" fill="url(#card-bg)" stroke="#151D4D" stroke-opacity="0.2"/>
      <text x="16" y="24" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">WEEKLY TROUNCE BOSSES (30 RESIN)</text>

      <rect x="14" y="34" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.08"/>
      <rect x="22" y="40" width="12" height="12" rx="3" fill="#151D4D"/>
      <path d="M25 46 L27 48 L31 43" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="50" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-decoration="line-through" opacity="0.6">The Knave: Arlecchino (Father Drop)</text>

      <rect x="14" y="62" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.04"/>
      <rect x="22" y="68" width="12" height="12" rx="3" fill="none" stroke="#151D4D" stroke-width="1.5"/>
      <text x="42" y="77" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">All-Devouring Narwhal (Fontaine)</text>

      <rect x="14" y="90" width="368" height="24" rx="6" fill="#151D4D" fill-opacity="0.04"/>
      <rect x="22" y="96" width="12" height="12" rx="3" fill="none" stroke="#151D4D" stroke-width="1.5"/>
      <text x="42" y="105" fill="#151D4D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Guardian of Apep's Oasis (Sumeru)</text>
    </g>

    <!-- Generator Watermark in Mockup -->
    <text x="30" y="355" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">✦ 3840×2160 Ultra 4K Canvas Output</text>
  </g>
</svg>
