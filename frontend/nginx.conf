map $http_accept $want_markdown {
    default 0;
    "~*text/markdown" 1;
}

# ./frontend/nginx.conf
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Pixel Studio validates project autosaves at 40 MB in the API.
    client_max_body_size 40m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        proxy_pass http://backend:8009;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # Agent discovery documents (must precede the hidden-file deny rule)
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /llms.txt {
        types { text/markdown txt; }
        default_type text/markdown;
    }

    location = /auth.md {
        default_type text/markdown;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = / {
        if ($want_markdown) { rewrite ^ /llms.txt last; }
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        try_files /index.html =404;
    }

    # SPA routing: serve index.html for any request that doesn't match an existing file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: block access to hidden files
    location ~ /\. {
        deny all;
    }
}
