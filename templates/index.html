<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallCraft — Wallpaper Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070f;
    --surface: #0e0e1e;
    --surface2: #14142a;
    --border: rgba(100,120,255,0.15);
    --accent: #5b8aff;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --warn: #f59e0b;
    --text: #e8e8f8;
    --muted: #7070a0;
    --danger: #f87171;
    --radius: 14px;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Outfit', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 36px;
    border-bottom: 1px solid var(--border);
    background: rgba(14,14,30,0.9);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* ── Buttons ── */
  .btn {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 9px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 20px rgba(91,138,255,0.3);
  }
  .btn-primary:hover { background: #7aa0ff; box-shadow: 0 0 30px rgba(91,138,255,0.5); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface); border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid transparent; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border); }
  .btn-danger { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
  .btn-danger:hover { background: rgba(248,113,113,0.25); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .btn-generate {
    font-size: 0.95rem;
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 0 30px rgba(91,138,255,0.35);
    border-radius: 10px;
  }
  .btn-generate:hover { box-shadow: 0 0 45px rgba(91,138,255,0.55); transform: translateY(-2px); }

  /* ── Layout ── */
  .app-body {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: var(--surface);
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  /* ── Task list ── */
  .task-list { display: flex; flex-direction: column; gap: 6px; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    border-radius: 8px;
    transition: all 0.15s;
    group: true;
  }
  .task-item:hover { border-color: var(--border); background: rgba(255,255,255,0.05); }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--muted);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .task-check.checked {
    background: var(--accent3);
    border-color: var(--accent3);
  }
  .task-check svg { display: none; }
  .task-check.checked svg { display: block; }

  .task-text {
    flex: 1;
    font-size: 0.88rem;
    color: var(--text);
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-weight: 400;
  }
  .task-text.done { text-decoration: line-through; color: var(--muted); }
  .task-text::placeholder { color: var(--muted); }

  .task-del {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: none; background: transparent;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all 0.15s;
    font-size: 14px;
  }
  .task-item:hover .task-del { opacity: 1; }
  .task-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

  .add-task-row {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .add-task-input {
    flex: 1;
    padding: 8px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-task-input:focus { border-color: var(--accent); }
  .add-task-input::placeholder { color: var(--muted); }

  /* ── Notes ── */
  .notes-textarea {
    width: 100%; padding: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.85rem;
    resize: vertical; min-height: 80px;
    outline: none; line-height: 1.6;
    transition: border-color 0.2s;
  }
  .notes-textarea:focus { border-color: var(--accent); }
  .notes-textarea::placeholder { color: var(--muted); }

  /* ── Settings ── */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .setting-label { font-size: 0.85rem; color: var(--muted); }

  .theme-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .theme-btn {
    padding: 10px 6px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.78rem;
    font-family: var(--font-body);
    cursor: pointer; transition: all 0.15s;
    text-align: center;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--text); }
  .theme-btn.active { border-color: var(--accent); background: rgba(91,138,255,0.1); color: var(--accent); }

  .res-select {
    padding: 7px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.82rem;
    outline: none; cursor: pointer;
  }

  /* ── Preview pane ── */
  .preview-pane {
    display: flex;
    flex-direction: column;
    padding: 28px 32px;
    gap: 20px;
    background: var(--bg);
  }

  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
  }

  .preview-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 300px;
  }

  .preview-img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
  .preview-img.visible { display: block; }

  .preview-placeholder {
    text-align: center;
    color: var(--muted);
  }
  .preview-placeholder .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
  .preview-placeholder p { font-size: 0.9rem; }

  /* ── Spinner ── */
  .spinner {
    display: none;
    width: 36px; height: 36px;
    border: 3px solid rgba(91,138,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    position: absolute;
  }
  .spinner.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 28px; right: 28px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9999;
  }
  .toast {
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    animation: slide-in 0.3s ease;
    max-width: 300px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast-success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: var(--accent3); }
  .toast-error { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
  .toast-info { background: rgba(91,138,255,0.15); border: 1px solid rgba(91,138,255,0.3); color: var(--accent); }
  @keyframes slide-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  /* ── Status bar ── */
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--muted);
    padding: 10px 32px;
    border-top: 1px solid var(--border);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(100,120,255,0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(100,120,255,0.4); }

  /* ── Responsive ── */
  @media (max-width: 800px) {
    .app-body { grid-template-columns: 1fr; }
    .preview-pane { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Wall<span>Craft</span></div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="saveAndGenerate()" id="saveBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="btn btn-generate" onclick="generate()" id="genBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Generate
    </button>
  </div>
</header>

<div class="app-body">

  <!-- ── Sidebar ── -->
  <div class="sidebar">

    <!-- Daily Tasks -->
    <div>
      <div class="section-title">Daily Tasks</div>
      <div class="card">
        <div class="task-list" id="daily-list"></div>
        <div class="add-task-row">
          <input class="add-task-input" id="daily-input" placeholder="Add task…" onkeydown="if(event.key==='Enter') addTask('daily')">
          <button class="btn btn-secondary" style="padding:8px 14px" onclick="addTask('daily')">+</button>
        </div>
      </div>
    </div>

    <!-- Weekly Tasks -->
    <div>
      <div class="section-title">Weekly Tasks</div>
      <div class="card">
        <div class="task-list" id="weekly-list"></div>
        <div class="add-task-row">
          <input class="add-task-input" id="weekly-input" placeholder="Add task…" onkeydown="if(event.key==='Enter') addTask('weekly')">
          <button class="btn btn-secondary" style="padding:8px 14px" onclick="addTask('weekly')">+</button>
        </div>
      </div>
    </div>

    <!-- Notes -->
    <div>
      <div class="section-title">Notes / Reminders</div>
      <div class="card">
        <textarea class="notes-textarea" id="notes" placeholder="Add a reminder or note…"></textarea>
      </div>
    </div>

    <!-- Settings -->
    <div>
      <div class="section-title">Settings</div>
      <div class="card">
        <div style="margin-bottom:16px">
          <div class="setting-label" style="margin-bottom:8px">Background Theme</div>
          <div class="theme-grid">
            <button class="theme-btn active" data-theme="gradient" onclick="setTheme('gradient')">Gradient</button>
            <button class="theme-btn" data-theme="abstract" onclick="setTheme('abstract')">Abstract</button>
            <button class="theme-btn" data-theme="mesh" onclick="setTheme('mesh')">Mesh</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Resolution</span>
          <select class="res-select" id="resolution">
            <option value="1920x1080">1920×1080 FHD</option>
            <option value="2560x1440">2560×1440 QHD</option>
            <option value="3840x2160">3840×2160 4K</option>
            <option value="1280x720">1280×720 HD</option>
            <option value="1366x768">1366×768 Laptop</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Download -->
    <div>
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="download()" id="dlBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Wallpaper
      </button>
    </div>

  </div>

  <!-- ── Preview Pane ── -->
  <div class="preview-pane">
    <div class="preview-header">
      <div>
        <div class="section-title">Preview</div>
      </div>
      <div id="preview-meta" style="font-size:0.78rem;color:var(--muted);font-family:var(--font-mono)"></div>
    </div>
    <div class="preview-box">
      <div class="spinner" id="spinner"></div>
      <div class="preview-placeholder" id="placeholder">
        <div class="icon"></div>
        <p>Click <strong>Generate</strong> to create your wallpaper</p>
      </div>
      <img class="preview-img" id="preview-img" alt="Generated wallpaper">
    </div>
  </div>

</div>

<div class="status-bar">
  <div class="dot"></div>
  <span id="status-text">Ready</span>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let state = {
  daily: [],
  weekly: [],
  notes: "",
  theme: "gradient",
  resolution: "1920x1080"
};

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/tasks');
    if (r.ok) state = await r.json();
  } catch(e) {}
  renderAll();
  checkStatus();
}

// ── Render ────────────────────────────────────────────────────────────────
function renderAll() {
  renderList('daily');
  renderList('weekly');
  document.getElementById('notes').value = state.notes || '';
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === state.theme);
  });
  const res = document.getElementById('resolution');
  res.value = state.resolution || '1920x1080';
}

function renderList(section) {
  const el = document.getElementById(`${section}-list`);
  el.innerHTML = '';
  (state[section] || []).forEach((task, i) => {
    const div = document.createElement('div');
    div.className = 'task-item';
    div.innerHTML = `
      <div class="task-check ${task.done ? 'checked' : ''}" onclick="toggleTask('${section}', ${i})">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5"><polyline points="2 6 5 9 10 3"/></svg>
      </div>
      <input class="task-text ${task.done ? 'done' : ''}" value="${escHtml(task.text)}" 
        onchange="editTask('${section}', ${i}, this.value)"
        onblur="editTask('${section}', ${i}, this.value)">
      <button class="task-del" onclick="deleteTask('${section}', ${i})">×</button>
    `;
    el.appendChild(div);
  });
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Task ops ──────────────────────────────────────────────────────────────
function addTask(section) {
  const inp = document.getElementById(`${section}-input`);
  const text = inp.value.trim();
  if (!text) return;
  state[section].push({ id: '', text, done: false });
  inp.value = '';
  renderList(section);
}

function toggleTask(section, i) {
  state[section][i].done = !state[section][i].done;
  renderList(section);
}

function editTask(section, i, val) {
  state[section][i].text = val;
}

function deleteTask(section, i) {
  state[section].splice(i, 1);
  renderList(section);
}

function setTheme(t) {
  state.theme = t;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === t));
}

// ── Gather state ──────────────────────────────────────────────────────────
function gatherState() {
  state.notes = document.getElementById('notes').value;
  state.resolution = document.getElementById('resolution').value;
  return state;
}

// ── API calls ─────────────────────────────────────────────────────────────
async function saveAndGenerate() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(gatherState())
    });
    if (r.ok) toast('Saved ✓', 'success');
    else toast('Save failed', 'error');
  } catch(e) { toast('Network error', 'error'); }
  btn.disabled = false;
}

async function generate() {
  await saveAndGenerate();
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  setStatus('Generating wallpaper…');
  showSpinner(true);

  try {
    const r = await fetch('/api/generate', { method: 'POST' });
    const data = await r.json();
    if (r.ok) {
      showPreview(data.path);
      toast(`Wallpaper generated in ${data.elapsed}s`, 'success');
      setStatus(`Last generated: ${new Date(data.generated_at).toLocaleTimeString()}`);
      document.getElementById('dlBtn').disabled = false;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('preview-meta').textContent = state.resolution + ' · ' + state.theme;
    } else {
      toast(data.detail || 'Generation failed', 'error');
      setStatus('Error during generation');
    }
  } catch(e) {
    toast('Network error', 'error');
    setStatus('Error');
  }

  showSpinner(false);
  btn.disabled = false;
}

function download() {
  window.location.href = '/api/download';
}

async function checkStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (d.has_wallpaper) {
      showPreview('/static/wallpaper.png?t=' + Date.now());
      document.getElementById('dlBtn').disabled = false;
      setStatus('Last generated: ' + new Date(d.last_modified).toLocaleTimeString());
    }
  } catch(e) {}
}

// ── UI helpers ────────────────────────────────────────────────────────────
function showSpinner(on) {
  document.getElementById('spinner').classList.toggle('active', on);
  document.getElementById('placeholder').style.display = on ? 'none' : '';
}

function showPreview(src) {
  const img = document.getElementById('preview-img');
  document.getElementById('placeholder').style.display = 'none';
  img.src = src;
  img.classList.add('visible');
}

function setStatus(msg) {
  document.getElementById('status-text').textContent = msg;
}

function toast(msg, type = 'info') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Boot ──────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
