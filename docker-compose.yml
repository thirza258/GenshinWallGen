services:
  backend:
    build:
      context: .                # project root as context
      dockerfile: backend/Dockerfile
    ports:
      - "8009:8009"
    env_file:
      - backend/.env           # or root .env if you have one
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist data and static files
      - backend-data:/app/data
      - backend-static:/app/static
      # Mount source folder (read-only is fine if only reading)
      - ./source:/app/source:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=/api
    ports:
      - "5155:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-static: